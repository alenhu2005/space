name: Test and deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Chromium, Firefox, WebKit and responsive behavior
        run: npm run test:e2e -- --project=desktop --project=tablet --project=mobile --project=firefox --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-linux
          path: test-results
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  visual:
    # Baselines are deliberately Darwin-specific: Linux fonts and WebGL output
    # must not be compared against screenshots captured on macOS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Six scenes at desktop, tablet and mobile sizes
        run: npm run test:e2e -- --project=visual-desktop --project=visual-tablet --project=visual-mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failures-macos
          path: test-results
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: [verify, visual]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
